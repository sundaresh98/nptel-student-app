services:
  - type: web
    name: nptel-admin-portal
    runtime: node
    rootDir: nptel-admin-portal
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=450
      - key: NEXTAUTH_SECRET
        generateValue: true

  - type: web
    name: student-application-app
    runtime: python
    rootDir: src/student-application-app
    buildCommand: python -m pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true